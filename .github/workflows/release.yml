name: Release builds

# Push a tag like v0.1.0 to build all platforms and create a draft GitHub release.
# "Run workflow" in the Actions tab builds the chosen platforms without a release (artifacts only).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [all, linux, windows, mac]
        default: all

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Tag pushes build everything; manual runs build what was picked.
        include: ${{ fromJSON(
          (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all') && '[{"os":"ubuntu-latest","target":"--linux"},{"os":"windows-latest","target":"--win"},{"os":"macos-latest","target":"--mac"}]' ||
          inputs.platforms == 'linux' && '[{"os":"ubuntu-latest","target":"--linux"}]' ||
          inputs.platforms == 'windows' && '[{"os":"windows-latest","target":"--win"}]' ||
          '[{"os":"macos-latest","target":"--mac"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          # No signing certificates: macOS gets an ad-hoc signature, Windows is unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
